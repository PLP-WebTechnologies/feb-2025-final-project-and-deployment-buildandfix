

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechTrend - Cart</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-100">
    <header class="bg-blue-600 text-white">
        <nav class="container mx-auto p-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold">TechTrend</h1>

                <li><a href="products.html" class="hover:underline">Products</a></li>

        <h2 class="text-3xl font-semibold mb-6">Your Cart</h2>
        <section id="cart-items" class="space-y-4">

        <button id="clear-cart" class="bg-red-600 text-white px-6 py-3 rounded hover:bg-red-700 mt-4">Clear Cart</button>
    </main>
    <footer class="bg-gray-800 text-white text-center p-4">
